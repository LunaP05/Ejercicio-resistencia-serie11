<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio - Circuitos Serie y Paralelo</title>
  <style>
    :root {
      --primary: #041c00;
      --secondary: #287840;
      --accent: #94c124;
      --bg: #f8fafc;
      --white: #ffffff;
      --border: #cbd5e1;
      --correct: #16a34a;
      --incorrect: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #1e293b;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .app-card {
      background: var(--white);
      width: 100%;
      max-width: 860px;
      height: 95vh;
      max-height: 660px;
      border-radius: 12px;
      border: 2px solid var(--primary);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sticky-header {
      background: var(--white);
      border-bottom: 2px solid var(--border);
      flex-shrink: 0;
    }

    .header-top {
      background-color: var(--primary);
      color: var(--white);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-top h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .score-badge {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--accent);
      padding: 3px 12px;
      border-radius: 20px;
      text-align: right;
    }

    .score-badge .label {
      font-size: 0.6rem;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 700;
      display: block;
    }

    .score-badge .val {
      font-size: 1rem;
      font-weight: 800;
      color: var(--white);
    }

    .instruction {
      padding: 8px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #0f172a;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
    }

    .symbols-bar {
      display: flex;
      gap: 6px;
      padding: 6px 16px;
      background: #ffffff;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    .sym-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .sym-btn:hover {
      background: var(--secondary);
      color: var(--white);
      border-color: var(--secondary);
    }

    .tabs-nav {
      display: flex;
      background: #e2e8f0;
      border-bottom: 2px solid var(--border);
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 10px;
      background: transparent;
      border: none;
      font-weight: 700;
      font-size: 0.85rem;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--white);
      color: var(--secondary);
      border-bottom: 3px solid var(--secondary);
    }

    .content-area {
      padding: 16px;
      overflow-y: auto;
      flex-grow: 1;
      background: #ffffff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--primary);
    }

    .input-field-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field-wrapper input {
      width: 100%;
      padding: 7px 30px 7px 10px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field-wrapper input:focus {
      border-color: var(--secondary);
    }

    .status-icon {
      position: absolute;
      right: 10px;
      font-size: 0.9rem;
      font-weight: bold;
      display: none;
    }

    .input-field-wrapper.correct input {
      border-color: var(--correct);
      background-color: #f0fdf4;
    }
    .input-field-wrapper.correct .status-icon {
      color: var(--correct);
      display: block;
    }
    .input-field-wrapper.correct .status-icon::after {
      content: "✔";
    }

    .input-field-wrapper.incorrect input {
      border-color: var(--incorrect);
      background-color: #fef2f2;
    }
    .input-field-wrapper.incorrect .status-icon {
      color: var(--incorrect);
      display: block;
    }
    .input-field-wrapper.incorrect .status-icon::after {
      content: "✖";
    }

    .footer-actions {
      padding: 10px 16px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-action {
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-reset {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-reset:hover {
      background: #cbd5e1;
    }

    .btn-verify {
      background: var(--secondary);
      color: var(--white);
    }
    .btn-verify:hover {
      background: #1e5c31;
    }
  </style>
</head>
<body>

<div class="app-card">
  <div class="sticky-header">
    <div class="header-top">
      <h1>Ejercicio</h1>
      <div class="score-badge">
        <span class="label">TOTAL</span>
        <span class="val" id="scoreDisplay">0.0 / 5.0</span>
      </div>
    </div>
    
    <div class="instruction">
      <b>1.</b> Calcule la resistencia total y la corriente I para cada circuito de la figura.
    </div>

    <div class="symbols-bar">
      <button class="sym-btn" onclick="insertSymbol('Ω')">Ω</button>
      <button class="sym-btn" onclick="insertSymbol('kΩ')">kΩ</button>
      <button class="sym-btn" onclick="insertSymbol('MΩ')">MΩ</button>
      <button class="sym-btn" onclick="insertSymbol('A')">A</button>
      <button class="sym-btn" onclick="insertSymbol('mA')">mA</button>
      <button class="sym-btn" onclick="insertSymbol('μA')">μA</button>
    </div>

    <div class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('a', event)">Circuito (a)</button>
      <button class="tab-btn" onclick="switchTab('b', event)">Circuito (b)</button>
      <button class="tab-btn" onclick="switchTab('c', event)">Circuito (c)</button>
      <button class="tab-btn" onclick="switchTab('d', event)">Circuito (d)</button>
    </div>
  </div>

  <div class="content-area">
    <!-- Circuito A -->
    <div id="tab-a" class="tab-content active">
      <div class="grid-form">
        <div class="input-group">
          <label><i>R</i><sub>T</sub></label>
          <div class="input-field-wrapper">
            <input type="text" id="rt_a" data-answers="20 ω,20ω,20">
            <span class="status-icon"></span>
          </div>
        </div>
        <div class="input-group">
          <label><i>I</i></label>
          <div class="input-field-wrapper">
            <input type="text" id="i_a" data-answers="3 a,3a,3">
            <span class="status-icon"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Circuito B -->
    <div id="tab-b" class="tab-content">
      <div class="grid-form">
        <div class="input-group">
          <label><i>R</i><sub>T</sub></label>
          <div class="input-field-wrapper">
            <input type="text" id="rt_b" data-answers="1.63 mω,1.63mω,1.63 mΩ,1.63mΩ,1.63">
            <span class="status-icon"></span>
          </div>
        </div>
        <div class="input-group">
          <label><i>I</i></label>
          <div class="input-field-wrapper">
            <input type="text" id="i_b" data-answers="6.13 μa,6.13μa,6.13 μA,6.13μA,6.13">
            <span class="status-icon"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Circuito C -->
    <div id="tab-c" class="tab-content">
      <div class="grid-form">
        <div class="input-group">
          <label><i>R</i><sub>T</sub></label>
          <div class="input-field-wrapper">
            <input type="text" id="rt_c" data-answers="110 ω,110ω,110">
            <span class="status-icon"></span>
          </div>
        </div>
        <div class="input-group">
          <label><i>I</i></label>
          <div class="input-field-wrapper">
            <input type="text" id="i_c" data-answers="318.18 ma,318.18ma,318.18">
            <span class="status-icon"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Circuito D -->
    <div id="tab-d" class="tab-content">
      <div class="grid-form">
        <div class="input-group">
          <label><i>R</i><sub>T</sub></label>
          <div class="input-field-wrapper">
            <input type="text" id="rt_d" data-answers="10 kω,10kω,10 kΩ,10kΩ,10">
            <span class="status-icon"></span>
          </div>
        </div>
        <div class="input-group">
          <label><i>I</i></label>
          <div class="input-field-wrapper">
            <input type="text" id="i_d" data-answers="12 ma,12ma,12">
            <span class="status-icon"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-actions">
    <button class="btn-action btn-reset" onclick="resetQuiz()">⟳ Reiniciar</button>
    <button class="btn-action btn-verify" onclick="evaluateQuiz()">✔ Verificar Respuestas</button>
  </div>
</div>

<script>
  let activeInput = null;

  document.querySelectorAll('input').forEach(input => {
    input.addEventListener('focus', () => { activeInput = input; });
  });

  function insertSymbol(sym) {
    if (activeInput) {
      const start = activeInput.selectionStart;
      const end = activeInput.selectionEnd;
      const val = activeInput.value;
      activeInput.value = val.substring(0, start) + sym + val.substring(end);
      activeInput.focus();
      activeInput.setSelectionRange(start + sym.length, start + sym.length);
    }
  }

  function switchTab(tabKey, event) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    event.target.classList.add('active');
    document.getElementById(`tab-${tabKey}`).classList.add('active');
  }

  function evaluateQuiz() {
    const inputs = document.querySelectorAll('input[data-answers]');
    let correctCount = 0;
    const totalInputs = inputs.length;

    inputs.forEach(input => {
      const parent = input.parentElement;
      const userVal = input.value.trim().toLowerCase().replace(/\s+/g, '');
      const validAnswers = input.dataset.answers.split(',').map(a => a.trim().toLowerCase().replace(/\s+/g, ''));

      if (userVal !== "" && validAnswers.includes(userVal)) {
        parent.classList.add('correct');
        parent.classList.remove('incorrect');
        correctCount++;
      } else if (userVal !== "") {
        parent.classList.add('incorrect');
        parent.classList.remove('correct');
      } else {
        parent.classList.remove('correct', 'incorrect');
      }
    });

    const finalScore = ((correctCount / totalInputs) * 5.0).toFixed(1);
    document.getElementById('scoreDisplay').innerText = `${finalScore} / 5.0`;
  }

  function resetQuiz() {
    document.querySelectorAll('input[data-answers]').forEach(input => {
      input.value = "";
      input.parentElement.classList.remove('correct', 'incorrect');
    });
    document.getElementById('scoreDisplay').innerText = "0.0 / 5.0";
  }
</script>

</body>
</html>
